name: knowflow

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowflow}
      POSTGRES_USER: ${POSTGRES_USER:-knowflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowflow_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  object-store:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowflow_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knowflow_minio_local_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_store_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      KNOWFLOW_DATABASE_URL: ${KNOWFLOW_DATABASE_URL:-postgresql+psycopg://knowflow:knowflow_local_only@db:5432/knowflow}
      KNOWFLOW_APP_ENV: ${KNOWFLOW_APP_ENV:-development}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_ISSUER: ${WORKOS_ISSUER:-}
      WORKOS_TOKEN_AUDIENCE: ${WORKOS_TOKEN_AUDIENCE:-https://api.knowflow.example}
      KNOWFLOW_WORKOS_API_BASE_URL: ${KNOWFLOW_WORKOS_API_BASE_URL:-https://api.workos.com}
      KNOWFLOW_OBJECT_STORAGE_ENDPOINT_URL: ${MINIO_ENDPOINT:-http://object-store:9000}
      KNOWFLOW_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-knowflow_local}
      KNOWFLOW_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-knowflow_minio_local_only}
      KNOWFLOW_OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-knowflow-documents}
      KNOWFLOW_OBJECT_STORAGE_REGION: ${KNOWFLOW_OBJECT_STORAGE_REGION:-us-east-1}
      HF_HOME: /models
      SENTENCE_TRANSFORMERS_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - model_cache:/models
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      KNOWFLOW_DATABASE_URL: ${KNOWFLOW_DATABASE_URL:-postgresql+psycopg://knowflow:knowflow_local_only@db:5432/knowflow}
      KNOWFLOW_APP_ENV: ${KNOWFLOW_APP_ENV:-development}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_ISSUER: ${WORKOS_ISSUER:-}
      WORKOS_TOKEN_AUDIENCE: ${WORKOS_TOKEN_AUDIENCE:-https://api.knowflow.example}
      KNOWFLOW_WORKOS_API_BASE_URL: ${KNOWFLOW_WORKOS_API_BASE_URL:-https://api.workos.com}
      KNOWFLOW_OBJECT_STORAGE_ENDPOINT_URL: ${MINIO_ENDPOINT:-http://object-store:9000}
      KNOWFLOW_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-knowflow_local}
      KNOWFLOW_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-knowflow_minio_local_only}
      KNOWFLOW_OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-knowflow-documents}
      KNOWFLOW_OBJECT_STORAGE_REGION: ${KNOWFLOW_OBJECT_STORAGE_REGION:-us-east-1}
      HF_HOME: /models
      SENTENCE_TRANSFORMERS_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    command: python -m app.jobs.worker
    volumes:
      - ./backend:/app
      - model_cache:/models
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      object-store:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: ${NEXT_PUBLIC_WORKOS_REDIRECT_URI:-http://localhost:3000/callback}
      WORKOS_COOKIE_MAX_AGE: ${WORKOS_COOKIE_MAX_AGE:-604800}
      WORKOS_COOKIE_SAMESITE: ${WORKOS_COOKIE_SAMESITE:-lax}
      WATCHPACK_POLLING: "true"
    command: npm run dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next

volumes:
  postgres_data:
  object_store_data:
  web_node_modules:
  web_next_cache:
  model_cache:
